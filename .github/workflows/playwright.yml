name: Playwright MCP Automation

on:

  push:
    branches: [ dev ]

  pull_request:
    branches: [ dev ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t agentic-playwright .

      - name: Run Tests
        run: |
          docker run \
          -e BASE_URL=${{ secrets.BASE_URL }} \
          -e USERNAME=${{ secrets.VALID_USERNAME }} \
          -e PASSWORD=${{ secrets.VALID_PASSWORD }} \
          -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          agentic-playwright npm run ci