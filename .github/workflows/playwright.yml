name: CI/CD Playwright + MCP

on:
  push:
    branches: [main]

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Build Docker container
      - name: Build Docker
        run: docker build -t mcp-playwright .

      # Run tests in container
      - name: Run Playwright + MCP
        run: |
          mkdir -p report
          docker run -v ${{ github.workspace }}/report:/app/report mcp-playwright

      # Install Allure (for generating HTML report)
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # Generate Allure report
      - name: Generate Allure HTML
        run: |
          allure generate report/allure-results -o report/allure-report --clean

      # Upload reports to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report