name: CI/CD Playwright + MCP

on:
  push:
    branches: [dev]

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Build Docker container
      - name: Build Docker
        run: docker build -t mcp-playwright .

      # 3️⃣ Run Playwright + MCP tests in container
      - name: Run Playwright + MCP
        run: |
          mkdir -p report
          docker run --rm \
            -v ${{ github.workspace }}/report:/app/playwright-report \
            mcp-playwright \
            npx playwright test --reporter=all

      # 4️⃣ Install Allure CLI
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # 5️⃣ Generate Allure HTML report
      - name: Generate Allure HTML
        run: |
          allure generate report/playwright-report/allure-results -o report/allure-report --clean
