name: CI/CD Playwright + MCP

on:
  push:
    branches: [dev]

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image
      - name: Build Docker
        run: docker build -t mcp-playwright .

      # 3️⃣ Run MCP inside container
      - name: Run MCP + Playwright
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            -v ${{ github.workspace }}/report:/usr/src/app/report \
            mcp-playwright